<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking · Campeonato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <img class="logo" src="logo.png" alt="Crosstraining Evolution" width="240" />
      <p class="eyebrow" id="modalidade"></p>
      <h1 id="nome-evento">CAMPEONATO</h1>
      <p class="data" id="data-evento" hidden></p>
      <p class="sub" id="local" hidden></p>
    </header>

    <p class="live"><span class="dot"></span><span id="status">Carregando…</span></p>

    <div id="podio" class="pod"></div>

    <section class="card lista-card">
      <h2 class="titulo-lista">Classificação geral</h2>
      <input type="search" id="busca" placeholder="Buscar atleta ou box" autocomplete="off" />
      <div class="hd"><span>Atleta</span><span>Pontos</span></div>
      <div id="lista"></div>
    </section>

    <p class="rodape" id="regra"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
