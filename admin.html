<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Campeonato · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container wide">
    <header class="hero small-hero">
      <img class="logo" src="logo.png" alt="Crosstraining Evolution" width="120" />
      <p class="eyebrow">Painel do organizador</p>
      <h1>ADMIN</h1>
    </header>

    <!-- Login -->
    <section id="tela-login" class="card">
      <h2>Entrar</h2>
      <form id="form-login">
        <label>E-mail <input type="email" id="email" required /></label>
        <label>Senha <input type="password" id="senha" required /></label>
        <p id="erro-login" class="erro" role="alert"></p>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </section>

    <!-- Painel -->
    <section id="tela-painel" hidden>
      <div class="toolbar">
        <span id="usuario" class="muted small"></span>
        <div class="toolbar-btns">
          <button class="btn btn-ghost" id="btn-csv" type="button">Baixar planilha (CSV)</button>
          <button class="btn btn-ghost" id="btn-imprimir" type="button">Imprimir</button>
          <button class="btn btn-ghost" id="btn-sair" type="button">Sair</button>
        </div>
      </div>

      <div class="resumo-admin">
        <div class="stat"><strong id="st-atletas">0</strong><span>Atletas</span></div>
        <div class="stat"><strong id="st-provas">0/4</strong><span>Provas lançadas</span></div>
        <div class="stat"><strong id="st-lider">—</strong><span>Líder</span></div>
      </div>

      <form id="form-novo" class="novo-atleta">
        <input id="novo-nome" placeholder="Nome do atleta" maxlength="80" required />
        <input id="novo-box" placeholder="Box (opcional)" maxlength="60" />
        <button class="btn" type="submit">Adicionar atleta</button>
      </form>

      <input type="search" id="busca-admin" placeholder="Buscar atleta ou box" autocomplete="off" />

      <p id="msg-admin" class="muted small" aria-live="polite"></p>
      <p id="vazio" class="muted small" hidden>Nenhum atleta ainda. Adicione o primeiro acima.</p>
      <div id="lista-admin" class="admin-grid"></div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
